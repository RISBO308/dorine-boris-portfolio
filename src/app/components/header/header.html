<header class="header">
  <nav class="header-nav">
    <div class="header-logo">
      <img src="logo dorine boris.jpg" alt="Logo Dorine Boris" class="logo-image" />
    </div>
    <button
      type="button"
      class="menu-toggle"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="header-links"
      aria-label="Ouvrir le menu"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="header-links" id="header-links" [class.is-open]="isMenuOpen">
      <a href="#accueil" class="header-link" (click)="closeMenu()">Accueil</a>
      <a href="#about" class="header-link" (click)="closeMenu()">À propos</a>
      <a href="#skills" class="header-link" (click)="closeMenu()">Compétences</a>
      <a href="#projects" class="header-link" (click)="closeMenu()">Projets</a>
      <a href="#parcours" class="header-link" (click)="closeMenu()">Parcours</a>
      <a href="#contact" class="header-link" (click)="closeMenu()">Contact</a>
    </div>
  </nav>
</header>
